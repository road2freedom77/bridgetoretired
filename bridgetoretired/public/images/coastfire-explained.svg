<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc">
  <title id="title">CoastFIRE: Where Compound Growth Takes Over</title>
  <desc id="desc">A navy and gold illustration showing the CoastFIRE concept: a growing portfolio curve that intersects a threshold line, marking the point where saving becomes optional.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c070"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#9a7f30"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0f1a2e"/>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Decorative dots -->
  <circle cx="100" cy="60" r="1" fill="#c9a84c" opacity="0.3"/>
  <circle cx="680" cy="80" r="1" fill="#c9a84c" opacity="0.4"/>
  <circle cx="740" cy="340" r="1" fill="#c9a84c" opacity="0.3"/>
  <circle cx="60" cy="350" r="1" fill="#c9a84c" opacity="0.3"/>
  <circle cx="220" cy="40" r="1" fill="#c9a84c" opacity="0.25"/>

  <!-- TOP BANNER -->
  <g transform="translate(400, 55)">
    <text x="0" y="0" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="11" letter-spacing="4">FINANCIAL INDEPENDENCE</text>
    <text x="0" y="34" text-anchor="middle" fill="#faf8f4" font-family="Georgia, serif" font-size="36" font-style="italic">CoastFIRE</text>
  </g>

  <!-- Chart area -->
  <g transform="translate(80, 140)">
    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
    <!-- X axis -->
    <line x1="0" y1="200" x2="640" y2="200" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>

    <!-- Grid reference lines -->
    <line x1="0" y1="50" x2="640" y2="50" stroke="#c9a84c" stroke-width="0.3" opacity="0.15" stroke-dasharray="2 4"/>
    <line x1="0" y1="100" x2="640" y2="100" stroke="#c9a84c" stroke-width="0.3" opacity="0.15" stroke-dasharray="2 4"/>
    <line x1="0" y1="150" x2="640" y2="150" stroke="#c9a84c" stroke-width="0.3" opacity="0.15" stroke-dasharray="2 4"/>

    <!-- Compound growth area fill -->
    <path d="M 0 195 Q 160 190 280 170 Q 400 140 520 80 Q 580 40 640 15 L 640 200 L 0 200 Z" fill="url(#curveGrad)" opacity="0.25"/>

    <!-- Compound growth curve (exponential) -->
    <path d="M 0 195 Q 160 190 280 170 Q 400 140 520 80 Q 580 40 640 15" fill="none" stroke="#c9a84c" stroke-width="2.5"/>

    <!-- CoastFIRE threshold point -->
    <circle cx="280" cy="170" r="8" fill="#0f1a2e" stroke="#c9a84c" stroke-width="2"/>
    <circle cx="280" cy="170" r="4" fill="#c9a84c"/>

    <!-- CoastFIRE label (above) -->
    <g transform="translate(280, 150)">
      <rect x="-55" y="-38" width="110" height="32" rx="4" fill="#0f1a2e" stroke="#c9a84c" stroke-width="1"/>
      <text x="0" y="-22" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="8" letter-spacing="2">COASTFIRE HIT</text>
      <text x="0" y="-10" text-anchor="middle" fill="#faf8f4" font-family="Georgia, serif" font-size="11" font-style="italic">Stop saving</text>
    </g>

    <!-- Vertical indicator line at CoastFIRE point -->
    <line x1="280" y1="170" x2="280" y2="200" stroke="#c9a84c" stroke-width="1" opacity="0.5" stroke-dasharray="2 3"/>

    <!-- End point (retirement) -->
    <circle cx="640" cy="15" r="10" fill="#faf8f4" stroke="#c9a84c" stroke-width="2"/>
    <text x="640" y="19" text-anchor="middle" fill="#0f1a2e" font-family="Georgia, serif" font-size="10" font-weight="700">65</text>

    <!-- Retirement label -->
    <g transform="translate(640, 40)">
      <text x="0" y="0" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="8" letter-spacing="2">FI NUMBER</text>
      <text x="0" y="12" text-anchor="middle" fill="#faf8f4" font-family="Georgia, serif" font-size="11" font-style="italic">Reached</text>
    </g>

    <!-- Age markers on X axis -->
    <g fill="#c9a84c" font-family="sans-serif" font-size="9" opacity="0.7">
      <text x="0" y="220" text-anchor="middle" letter-spacing="1">25</text>
      <text x="160" y="220" text-anchor="middle" letter-spacing="1">30</text>
      <text x="280" y="220" text-anchor="middle" font-weight="600" letter-spacing="1">35</text>
      <text x="400" y="220" text-anchor="middle" letter-spacing="1">45</text>
      <text x="520" y="220" text-anchor="middle" letter-spacing="1">55</text>
      <text x="640" y="220" text-anchor="middle" letter-spacing="1">65</text>
    </g>

    <!-- X axis title -->
    <text x="320" y="245" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="9" letter-spacing="3" opacity="0.6">AGE</text>

    <!-- Y axis title -->
    <text x="-25" y="100" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="9" letter-spacing="3" opacity="0.6" transform="rotate(-90, -25, 100)">PORTFOLIO VALUE</text>

    <!-- Left side: "You save" label -->
    <text x="140" y="125" text-anchor="middle" fill="#faf8f4" font-family="Georgia, serif" font-size="11" font-style="italic" opacity="0.75">You save</text>
    <text x="140" y="138" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="8" letter-spacing="1" opacity="0.6">(contributions)</text>

    <!-- Right side: "Compound does the rest" label -->
    <text x="460" y="125" text-anchor="middle" fill="#faf8f4" font-family="Georgia, serif" font-size="11" font-style="italic" opacity="0.75">Compound does the rest</text>
    <text x="460" y="138" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="8" letter-spacing="1" opacity="0.6">(no new savings)</text>
  </g>

  <!-- Bottom caption -->
  <text x="400" y="395" text-anchor="middle" fill="#c9a84c" font-family="sans-serif" font-size="10" letter-spacing="3" opacity="0.7">FI NUMBER ÷ (1 + REAL RETURN)^YEARS TO RETIREMENT</text>
</svg>
